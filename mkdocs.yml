site_name: grok_switch
site_description: 用供应商 Profile 管理 Grok CLI 配置的本地托盘工具
site_url: https://1parado.github.io/grok-build-switch/

repo_name: 1parado/grok-build-switch
repo_url: https://github.com/1parado/grok-build-switch

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: deep orange

nav:
  - 首页: index.md
  - 使用教程: usage.md
  - 博客: blog/index.md
  - 联系方式: contact.md

plugins:
  - search
  - blog:
      blog_dir: blog
      post_dir: "{blog}/posts"
      post_date_format: full
      # i18n 构建下归档/分类页是构建期虚拟文件，无法判定语言归属会产生警告，显式关闭
      archive: false
      categories: false
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 简体中文
        - locale: en
          name: English
          site_name: grok_switch
          nav_translations:
            首页: Home
            使用教程: Usage
            博客: Blog
            联系方式: Contact

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - assets/stylesheets/extra.css
